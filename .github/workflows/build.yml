name: Build CV

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5

      - name: Compile general CV
        run: typst compile --font-path fonts cv.typ Nick-Quirk-CV.pdf

      - name: Compile variants
        run: |
          typst compile --font-path fonts --input focus=audio cv.typ Nick-Quirk-CV-audio.pdf
          typst compile --font-path fonts --input focus=backend cv.typ Nick-Quirk-CV-backend.pdf

      - uses: actions/upload-artifact@v6
        with:
          name: cv
          path: '*.pdf'

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.pdf'
